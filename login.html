<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="loginTitle">تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css" />
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
</head>
<body class="login-page">

    <!-- ===== صفحة تسجيل الدخول ===== -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-tools login-icon"></i>
                <h2 data-i18n="loginTitle">تسجيل الدخول</h2>
            </div>
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="username" data-i18n="username">اسم المستخدم</label>
                    <input type="text" id="username" placeholder="admin" required />
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••" required />
                </div>
                <div id="loginError" class="login-error" style="display: none;"></div>
                <button type="submit" class="login-btn" data-i18n="loginButton">دخول</button>
            </form>
            <div class="login-footer">
                <span data-i18n="loginHint">استخدم admin / admin</span>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
